server:
  port: 8082

spring:
  application:
    name: agent-service
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
    mcp:
      client:
        enabled: true
        type: SYNC
        sse:
          connections:
            mcp-hub:
              url: http://localhost:8085
