server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: agent-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/agent/**
        - id: alert-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/alerts/**
        - id: mcp-hub
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/tools/**
        - id: metrics-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/metrics/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
