server:
  port: 8080
  servlet:
    context-path: /MCP

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        # 阶段0 仅打通 auth-service；后续服务路由随阶段补充
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
