server:
  port: 8081
  servlet:
    context-path: /xyup

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/aicops
    username: root
    password: root123456
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# JWT 配置（阶段0 演示用；生产需改为环境变量注入强密钥）
app:
  jwt:
    secret: aicops-dev-secret-key-change-me-please-0123456789abcdef
    expire-seconds: 7200

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.aicops: DEBUG
